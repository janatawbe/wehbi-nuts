<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <title>Wehbi Nuts</title>
    <!-- Storefront typefaces (Milestone 9) -- Fraunces for distinctive,
         editorial display headlines (its own italic stands in for a
         script accent, so no separate handwritten font is loaded);
         Libre Franklin for clean, sharp, highly-readable UI/body text.
         Cairo (Milestone 9 Arabic support) is the storefront's Arabic
         typeface -- a sharp, geometric Arabic sans that keeps the same
         editorial/premium, not-rounded-or-bubbly direction as the Latin
         pairing; used for BOTH headings and body text when Arabic is
         selected (see index.css's [data-storefront-lang="ar"] override).
         Admin tooling never loads/uses any of these -- see AdminLayout. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,600&family=Libre+Franklin:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
